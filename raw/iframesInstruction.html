	/* Instruction Screen css */
	
	body{
	font-family: 'OpenSans-Regular';
    font-size: 16px;
	}
	.mainHeading {
    font-size: 1.8125em;
    font-family: 'OpenSans-Semibold'; 
    margin-bottom: 20px; 
    }
	
	.instructionScreen {
	    padding: 30px;
	    width: 75%;
	    margin: 0 auto;
	}
	.mainHeading {
	    font-size: 1.8125em;
	    font-family: 'OpenSans-Semibold'; 
	    margin-bottom: 20px; 
	}
	b, strong {
	    font-weight: 600;
	    font-family: OpenSans-Semibold;
	}
	.subHeading {
	   font-size: 1.25em; 
	   line-height: 1.3125em;
	   margin-bottom: 15px;
	   color: var(--black);
	}
	.instructionScreen p {
	    font-size: 1.125em;
	    color: var(--fontLight);
	    margin-bottom: 5px;
	}
	
    .instructionLists{
    	list-style: none;
        padding: unset;
	 }
	
	.instructionLists li {
	list-style: none;
    font-size: 1.125em;
    color: var(--fontLight);
    margin-bottom: 18px;
    padding-left: 28px;
    position: relative;
	}
	
	.instructionLists li:before {
	    content: '';
	    width: 18px;
	    height: 14px;
	    position: absolute;
