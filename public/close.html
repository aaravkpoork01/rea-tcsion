		<script>
			window.onresize= function(){alignHeight();};
			var isLX=false;
			var dispayExitMsg=new Array();
			var useDefaultExitMessageConfiguration="";
			var exitMessageConfigurationPath="";
			function validateClosePageURL(){
				if(document.URL.indexOf("autoMock")>=0){
					validateClosePageURLAfterDataFetch();
					alignHeight();
					setTimeout(function(){
						$('#container').removeAttr("aria-hidden");
				       	$('#container').focus();
						},1000);
				}
				else{
				loadDataFromCache().then(function(e){
					console.log(e)
				}).finally(function(){
					validateClosePageURLAfterDataFetch();
					alignHeight();
					setTimeout(function(){
						$('#container').removeAttr("aria-hidden");
				       	$('#container').focus();
						},1000);
				});
				}
			}
			function validateClosePageURLAfterDataFetch(){
				var url = document.URL;
				var urlStatus = false;
				
				if(url.indexOf("roomURL") > 0){
					$("#pWait").hide();
					$('#closeMsg')
							.html(
									'Dear Candidate, <br/>You have successfully submitted the assessment and the process of Room Capturing has also been completed, Kindly close this Page to Exit.');
					$('.btnsection').hide();
					$('.noteToCloseWindow').hide();
					
				} else if(url.indexOf("autoMock")<0){
				var params = url.split("close.html?");
				var orgId = params[1].trim().split("@@")[0];
				var mockId = params[1].trim().split("@@")[1];
				var subscribedFor = params[1].trim().split("@@")[2];
				var hasCustomMessage=false;
				if(params.length>1 ){
					if(mockId.indexOf("#")>-1){
							mockId = mockId.substring(0,mockId.indexOf("#"));
					}
					if(params[1].trim().length>0){
						var xml =validateExpiry(orgId,mockId);
						//var xml = readAndReturnXML(xmlFilePath+'/confDetails.xml');
						basicDetails(xml,false,"Close");
						loadClosePageLabel();
					    useDefaultExitMessageConfiguration = typeof($(xml).find("useDefaultExitMessageConfiguration").text()) != "undefined" ? $(xml).find("useDefaultExitMessageConfiguration").text() : "YES";
						exitMessageConfigurationPath =  typeof($(xml).find("ExitMessageConfigurationPath").text()) != "undefined" ? $(xml).find("ExitMessageConfigurationPath").text() : "YES";
						//loadClosePageLabel();
						$("#pWait").hide();
					}
					if(subscribedFor.toUpperCase().indexOf('LX')!= -1 && mockVar.storeCandResponse==1){
						isLX=true;
						$('#closeMsg').html($(globalXmlvar).find('closePageLXMessage').text());
					}
					
					try {
							if (sessionStorage.subscribed_for == "iEvolve") {
								$('#closeMsg').empty();
								$('#closeMsg').append("Dear Candidate, You have now successfully submitted the Exam. <br><b>Number of attempts submitted : "+ sessionStorage.attemptId +"/"+ sessionStorage.TotalAttempts+".</b>");
							}
						} catch (e) {

						}
					} else {
						window.location.href = "error.html";
					}
				    if(typeof(sessionStorage.xmlFilePath) != "undefined")
					xmlFilePath = sessionStorage.xmlFilePath;
				    if(useDefaultExitMessageConfiguration=="NO" && (exitMessageConfigurationPath != "" && exitMessageConfigurationPath.indexOf("html") > 0)){
					   $("#container").hide();
					   $("#footer").hide();
					   $("#iframe").show();
					   $("#customeFile").attr('src',(xmlFilePath+"/"+exitMessageConfigurationPath));
				    } 
				    else {
				    	if ($.cookie("defaultexitPageOA") == 'NO') {
				    		var subjectInstructionsDetails = sessionStorage.SubjectLevelInstructions == "YES"? sessionStorage.subjectId+"_": "";
						var cdnPath = (typeof(sessionStorage.cdnPath)!="undefined" && sessionStorage.cdnPath != "") ? sessionStorage.cdnPath+"/" : "";
						if (typeof (sessionStorage.xmlFilePath) != "undefined")
							xmlFilePath = sessionStorage.xmlFilePath;
						var xml = readAndReturnXML(xmlFilePath
								+ '/'+subjectInstructionsDetails+'custInstructions.xml'+'?v='+sessionStorage.assessmentUpdatedDate,true);
						var optTxt = '';
						var i = 1;
						var countToDisplay = 0;
						$(xml).find("INSTRUCTION").each(
								function() {
									var langId = $(this).find("LANGID").text();
									countToDisplay++;
									var langName = $(this).find("LANGNAME")
											.text();
									var msgtext = $(this)
											.find('EXITPAGETEXTOA').text();
									dispayExitMsg[langId] = msgtext;
									optTxt += "<option value="+langId+">"
											+ langName + "</option>";
									$('#closeMsg').html(dispayExitMsg[i]);
								});

						hasCustomMessage = true;

					}

					if ($.cookie("defaultexitPage") == 'NO') {
						var subjectInstructionsDetails = sessionStorage.SubjectLevelInstructions == "YES"? sessionStorage.subjectId+"_": "";
						var cdnPath = (typeof(sessionStorage.cdnPath)!="undefined" && sessionStorage.cdnPath != "") ? sessionStorage.cdnPath+"/" : "";
						if (typeof (sessionStorage.xmlFilePath) != "undefined")
							xmlFilePath = sessionStorage.xmlFilePath;
						var xml = readAndReturnXML(xmlFilePath
								+ '/'+subjectInstructionsDetails+'custInstructions.xml'+'?v='+sessionStorage.assessmentUpdatedDate,true);
						var optTxt = '';
						var i = 1;
						var countToDisplay = 0;
						$(xml).find("INSTRUCTION").each(
								function() {
									var langId = $(this).find("LANGID").text();
									countToDisplay++;
									var langName = $(this).find("LANGNAME")
											.text();
									var msgtext = $(this).find('EXITPAGETEXT')
											.text();
									dispayExitMsg[langId] = msgtext;
									optTxt += "<option value="+langId+">"
											+ langName + "</option>";
									$('#closeMsg').html(dispayExitMsg[i]);
								});
						hasCustomMessage = true;
					}

					if (countToDisplay > 1) {
						$("#defaultLangOptions").show();
					}

					$("#defaultLanguage1").append(optTxt);
					$.removeCookie("defaultexitPage");
					$.removeCookie("defaultexitPageOA");
					if (!hasCustomMessage) {
						if (((document.URL.indexOf('isApp') >= 0) ? true
								: false)) {
							$('.noteToCloseWindow').hide();
							$('#closeBtn').hide();
							if (isLX)
								$('#closeMsg').html(
										$(globalXmlvar).find(
												'closePageLXIsAppMessage')
												.text());
							else
								$('#closeMsg').html(
										$(globalXmlvar).find(
												'closePageWindowMessage')
												.text());
						} else if (((document.URL.indexOf('isLauncher') >= 0) ? true
								: false)) {
							$('#closeBtn').hide();
							$('.noteToCloseWindow').show();
							$('#closeMsg').html(
									$(globalXmlvar).find(
											'closePageWindowMessageLauncher')
											.text());
							$('.noteToCloseWindowMessage')
									.html(
											$(globalXmlvar)
													.find('noteshiftEsc')
													.text());
						} else {
							$('.noteToCloseWindow').hide();
						}
					} else {
						displayExitMsg();
						if (((document.URL.indexOf('isApp') >= 0) ? true
								: false)) {
							$('.noteToCloseWindow').hide();
							$('#closeBtn').hide();
						} else if (((document.URL.indexOf('isLauncher') >= 0) ? true
								: false)) {
							$('#closeBtn').hide();
							$('.noteToCloseWindow').show();
							$('.noteToCloseWindowMessage')
									.html(
											$(globalXmlvar)
													.find('noteshiftEsc')
													.text());
						} else {
							$('.noteToCloseWindow').hide();
						}
					}
				}
				} else {
					$("#pWait").hide();
					$('#closeMsg')
							.html(
									'Dear Participant,<br/>You have now completed the assessment.  Close the window to close the assessment.');
					$('.noteToCloseWindow').hide();
				}
			  
			}
			function displayExitMsg() {
				$('#closeMsg').html(dispayExitMsg[defaultLanguage1.value]);
			}
			function proctoringCheck() {
				try {
					IBA.exit();
					
				} catch (e) {
					if ($.cookie("isPaperDevice") != undefined
							&& $.cookie("isPaperDevice") == "true")
						IBA.exit();
					else {

						window.parent.close();
						$("#pWait").hide();
						setTimeout(function(){var pathPrefix = "",xml;
						if(sessionStorage.isCustmLangxml=="true") {
							if(typeof(sessionStorage.cdnPath)!="undefined" && sessionStorage.cdnPath != ""){
								//pathPrefix+=sessionStorage.cdnPath;
							}
							pathPrefix+=sessionStorage.custLangXMLPath;
							var custLangVersion =  (typeof(sessionStorage.custLangVersion)!="undefined" && sessionStorage.custLangVersion != "") ? sessionStorage.custLangVersion : "123";
								xml = readAndReturnXML(pathPrefix+'LangXML/'+mockVar.langName+'.xml'+'?v='+custLangVersion,false);
							    if(sessionStorage.isExaminer == 'false')
							$('#closeMsg').html($(xml).find('ClosePageMessageOA').text());
							    else
				    	$('#closeMsg').html($(xml).find('ExaminerClosePageMessageOA').text());
						}
						else {$('#closeMsg')
							.html(
							'Dear Participant,<br/>You have now completed the assessment. Close the window to close the assessment.');}
					},500);
						/* $('#closeMsg')
								.html(
										'Dear Participant,<br/>You have now completed the assessment. Close the window to close the assessment.'); */
						$('.btnsection').hide();
						$('.noteToCloseWindow').hide();
						if(sessionStorage.isSecured=="true" && sessionStorage.operatingSystem !=undefined && (sessionStorage.operatingSystem.toUpperCase() == "MAC OS" || sessionStorage.operatingSystem.toUpperCase() == "MAC OS X" || sessionStorage.operatingSystem.toUpperCase() == "iOS") && sessionStorage.isPaperDevice == "false")
						{
						 	window.webkit.messageHandlers.exit.postMessage("exit") ;
						 	setTimeout(function(){
						 		window.webkit.messageHandlers.exit.postMessage("exit") ;
						},1000);
						}
					}

				}
			}

			$(document).ready(function(){
				if(typeof(sessionStorage.assessmentLogoPath)!='undefined'){
					document.head.insertAdjacentHTML(
						  "beforeend",
						  '<link rel="icon" class="favicon" type="image/png" href="'+sessionStorage.assessmentLogoPath+'?v=' + Date.now() +'">'
						);
				}
			/* if(((document.URL.indexOf('isApp') >= 0) ? true : false)){
				$('.noteToCloseWindow').hide();
				$('#closeBtn').hide();
				if(isLX)
				$('#closeMsg').html("Dear Participant,<br/>You have now completed the assessment.  Close the window to close the assessment and return to the course page to see your result.");
				else
				$('#closeMsg').html("Dear Participant,<br/>You have now completed the assessment.  Close the window to close the assessment.");
			} */
			}); 
		</script>

	:root {
            --min-size: 2px;
            --max-size: 20px;
        }
#pWait .load {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            margin: 0px auto;
            left: 0px;
            right: 0px;
            top: 50%;
        }

        .load .dot {
            background: white;
            margin: 5px;
            -webkit-animation-name: loader;
            animation-name: loader;
            -webkit-animation-duration: 1s;
            animation-duration: 1s;
            -webkit-animation-iteration-count: infinite;
            animation-iteration-count: infinite;
            -webkit-animation-direction: alternate;
            animation-direction: alternate;
        }

        .load .dot:nth-child(1) {
            -webkit-animation-delay: 0.2s;
            animation-delay: 0.2s;
            background: #F03782;
        }

        .load .dot:nth-child(2) {
            -webkit-animation-delay: 0.4s;
            animation-delay: 0.4s;
            background: #9482C5;
        }

        .load .dot:nth-child(3) {
            -webkit-animation-delay: 0.6s;
            animation-delay: 0.6s;
            background: #EF7333;
        }

        .load .dot:nth-child(4) {
            -webkit-animation-delay: 0.8s;
            animation-delay: 0.8s;
            background: #64E6E1;
        }

        .load .dot:nth-child(5) {
            -webkit-animation-delay: 1s;
            animation-delay: 1s;
            background: #FFE600;
        }


        @-webkit-keyframes loader {
            from {
                width: 2px;
                width: var(--min-size);
                height: 2px;
                height: var(--min-size);
                border-radius: calc(2px / 2);
                border-radius: calc(var(--min-size) / 2);
            }

            to {
                width: 20px;
                width: var(--max-size);
                height: 20px;
                height: var(--max-size);
                border-radius: calc(20px / 2);
                border-radius: calc(var(--max-size) / 2);
            }
        }



        @keyframes loader {
            from {
                width: 2px;
                width: var(--min-size);
                height: 2px;
                height: var(--min-size);
                border-radius: calc(2px / 2);
                border-radius: calc(var(--min-size) / 2);
            }

            to {
                width: 20px;
                width: var(--max-size);
                height: 20px;
                height: var(--max-size);
                border-radius: calc(20px / 2);
                border-radius: calc(var(--max-size) / 2);
            }
        }
		</style>
