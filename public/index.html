        <script>
		 function openerNew(openInSameWindow){
            var params =  'top=0, left=0';
            params += ', width='+screen.width+', height='+screen.height+',statusbar=no,toolbar=no,location=no,directories=no,menubar=no,resizable=no';
            params += ', scrollbars=yes, status=no, fullscreen=yes';
			var url = document.URL;
			var urlSplit = url.split("index.html?");
			if(urlSplit[1].indexOf("eID=")==-1){
			var orgId = $.trim(urlSplit[1]).split("@@")[0];
			sessionStorage.orgId = orgId;
			var mockId = $.trim(urlSplit[1]).split("@@")[1];
			sessionStorage.assessmentId = mockId;
			}
			sessionStorage.operatingSystem = "";//It was not showing numeric board for numeric;
			if(url.indexOf("MOA") != -1){
				isPaperMock = $.trim(urlSplit[1]).split("@@")[2];
				url = url.substr(0,url.lastIndexOf("@@"));
			}
			var viewInLang = document.getElementById('languageSelect').value;
			setCookie(viewInLang);
			if(url.indexOf("autoMock") >= 0 || (isPaperMock == "1" || sessionStorage.isPaperMock=="1")){
				  window.location.href="instructions.html?"+url.split("index.html?")[1];
			}
			else{
				if(openInSameWindow){
					if(sessionStorage.photoVerificationRequiredAtlaunch=='YES')
						window.location.href="photoVerification.html?"+url.split("index.html?")[1]+"@@"+sessionStorage.userdefinedcandconsole;
					else
					window.location.href="instructions.html?"+url.split("index.html?")[1]+"@@"+sessionStorage.userdefinedcandconsole;
					
				}	
				else{
					if(sessionStorage.photoVerificationRequiredAtlaunch=='YES')
						newwin=window.open("photoVerification.html?"+url.split("index.html?")[1]+"@@"+sessionStorage.userdefinedcandconsole,"_blank",params);
					else
					newwin=window.open("instructions.html?"+url.split("index.html?")[1]+"@@"+sessionStorage.userdefinedcandconsole,"_blank",params);
					
	           	 	if (window.focus) {newwin.focus()}
		            return false;
				}
			}	
        }

		var signingIn = false;

		// Two-step login: the first click verifies the credentials and reveals the
		// candidate identity; only a second click on Login starts the assessment.
		var signInState = { verified: null, busy: false, busyLabel: "" };

		function currentSignInContext(){
			var url = document.URL;
			var urlSplit = url.split("index.html?");
			var orgId = $.trim(urlSplit[1]).split("@@")[0];
			var mockId = $.trim(urlSplit[1]).split("@@")[1];
			if(url.indexOf("eID=") > -1){
				orgId = sessionStorage.orgId;
				mockId = sessionStorage.assessmentId;
			}
			return {
				orgId: orgId,
				mockId: mockId,
				login: $.trim($("input[name=text15]").val()),
				password: $("input[name=text14]").val()
			};
		}

		function applySignInLabel(){
			var label = $("#signInLabel");
			if(!label.length){ return; }
			var text = signInState.busy ? signInState.busyLabel : (signInState.verified ? "Login" : "Verify");
			if(label.text() !== text){ label.text(text); }
		}

		function applyVerifiedIdentity(){
			if(!signInState.verified){ return; }
			var candidate = signInState.verified.candidate || {};
			var assessment = signInState.verified.assessment || {};
			var candidateName = candidate.name || "Your Name";
			$("#mockSysNum").text(candidate.systemName || assessment.id || signInState.verified.mockId || "");
			$(".candOriginalName").text(candidateName).attr("title", candidateName);
			$("#mockSubName").text(assessment.name || "");
			$(".candidateImg").attr("src", candidate.photo || "images/NewCandidateImage.jpg");
			$(".candidateImg").show();
			$(".userInfo").show();
		}

		// loadIndexLabels() runs after the page cache loads and would otherwise
		// overwrite the Verify/Login label and the verified identity panel.
		(function guardIndexLabels(){
			if(typeof window.loadIndexLabels !== "function" || window.loadIndexLabels.__signInGuarded){ return; }
			var originalLoadIndexLabels = window.loadIndexLabels;
			var guardedLoadIndexLabels = function(){
				var result = originalLoadIndexLabels.apply(this, arguments);
				applySignInLabel();
				applyVerifiedIdentity();
				return result;
			};
			guardedLoadIndexLabels.__signInGuarded = true;
			window.loadIndexLabels = guardedLoadIndexLabels;
		})();

		function resetVerification(){
			if(signInState.busy || !signInState.verified){ return; }
			signInState.verified = null;
			$(".userInfo").hide();
			applySignInLabel();
		}

		function setSignInBusy(text){
			signInState.busy = true;
			signInState.busyLabel = text;
			applySignInLabel();
			$("#indexLoader").show();
			$("input[name=text15], input[name=text14]").prop("disabled", true);
		}

		function clearSignInBusy(){
			signInState.busy = false;
			signInState.busyLabel = "";
			$("#indexLoader").hide();
			$("input[name=text15], input[name=text14]").prop("disabled", false);
			applySignInLabel();
		}

		function postLogin(path, payload){
			return fetch(path, {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(payload)
			}).then(function(res){
				return res.json().catch(function(){ return null; }).then(function(data){
					if(!res.ok || !data || !data.ok){
						var error = new Error((data && data.error) ? data.error : "Sign in failed. Please try again.");
						error.status = res.status;
						error.userMessage = error.message;
						throw error;
					}
					return data;
				});
			});
		}

		function doVerify(context){
			signingIn = true;
			setSignInBusy("Verifying...");
			postLogin("/IBA/api/login/verify", context).then(function(data){
				if(!data.candidate){
					var error = new Error("Verification failed. Please try again.");
					error.userMessage = error.message;
					throw error;
				}
				signInState.verified = {
					candidate: data.candidate,
					assessment: data.assessment || {},
					login: context.login,
					password: context.password,
					mockId: context.mockId
				};
				signingIn = false;
				clearSignInBusy();
				applyVerifiedIdentity();
			}).catch(function(error){
				signingIn = false;
				clearSignInBusy();
				alert((error && error.userMessage) ? error.userMessage : "Unable to reach the assessment server.");
			});
		}

		function doLogin(context){
			signingIn = true;
			setSignInBusy("Logging in...");
			postLogin("/IBA/api/login", context).then(function(data){
				if(!data.candidate || !data.attempt || !data.assessment){
					var error = new Error("Sign in failed. Please try again.");
					error.userMessage = error.message;
					throw error;
				}
				sessionStorage.cand_master_id = data.candidate.id;
				sessionStorage.attemptId = String(data.attempt.id);
				sessionStorage.username = data.candidate.name;
				sessionStorage.qp_id = data.assessment.id;
				sessionStorage.qpLanguages = data.assessment.languages || "";
				sessionStorage.defaultLang = data.assessment.primaryLanguage ? String(data.assessment.primaryLanguage.id) : "";
				sessionStorage.duration = data.assessment.duration != null ? String(data.assessment.duration) : "";
				sessionStorage.questionCount = data.assessment.questionCount != null ? String(data.assessment.questionCount) : "";
				sessionStorage.isResumed = data.attempt.resumed ? "1" : "0";
				sessionStorage.showfeedbackpage = data.assessment.showFeedback ? "1" : "0";
				sessionStorage.enableFullscreen = data.assessment.enableFullscreen ? "1" : "0";
				sessionStorage.requireFullscreen = data.assessment.requireFullscreen ? "1" : "0";
				sessionStorage.trackFullscreen = data.assessment.trackFullscreen ? "1" : "0";
				sessionStorage.consoleVersion = (data.assessment && data.assessment.version) || data.version || "17.07.00";
				document.cookie = "consoleVersion=" + encodeURIComponent(sessionStorage.consoleVersion) + "; path=/";
				sessionStorage.assessType = "Mock";
				sessionStorage.notificationPrompt = "false";
				sessionStorage.isOnline = "1";
				try { sessionStorage.timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) { sessionStorage.timeZone = "Asia/Kolkata"; }
				openerNew(true);
			}).catch(function(error){
				signingIn = false;
				clearSignInBusy();
				if(error && (error.status === 400 || error.status === 401)){
					signInState.verified = null;
					$(".userInfo").hide();
					applySignInLabel();
				}
				alert((error && error.userMessage) ? error.userMessage : "Unable to reach the assessment server.");
			});
		}

		function signIn(){
			if(signingIn){ return false; }
			var context = currentSignInContext();
			if(context.login === ""){ alert("Please enter your Login ID."); return false; }
			if(context.password === ""){ alert("Please enter your Password."); return false; }
			if(signInState.verified){
				if(context.login !== signInState.verified.login || context.password !== signInState.verified.password){
					resetVerification();
					alert("Your login details changed. Please verify again.");
					return false;
				}
				doLogin(context);
				return false;
			}
			doVerify(context);
			return false;
		}
		function signInOnEnter(e){
			if(e && (e.which === 13 || e.keyCode === 13)){ signIn(); if(e.preventDefault) e.preventDefault(); return false; }
		}
		 $(document).ready(function() {
			$("input[name=text15]").on("keydown", signInOnEnter);
			$("input[name=text14]").on("keydown", signInOnEnter);
			$("input[name=text15], input[name=text14]").on("input change", function(){
				if(!signInState.busy){ resetVerification(); }
			});
			applySignInLabel();
			var url = document.URL;
			var urlSplit = url.split("index.html?");
			var orgId = $.trim(urlSplit[1]).split("@@")[0];
			 if(orgId == "33037"){
				 $('#notMySystem').hide();
			 }else{
				 $('#notMySystem').show();
			 }
			 if(sessionStorage.userdefinedcandconsole=="1"){
				 $("#indexLoader").show();
				 setTimeout(function(){
					 $("#indexLoader").hide();
				 },2000);
			 }
		 });
		window.onresize= function(){alignHeight();};
		
		function focusAndClickButtons(){ // added for WCAG compliant -> make buttons focusable and clickable by pressing space and enter
			$("img.keyboardInputInitiator").attr("tabindex","0");
			$("img.keyboardInputInitiator").attr("role","button");
			$("img.keyboardInputInitiator").attr("onkeypress","clickThisElement(this,event)");
			
			$("#signInLabel").attr("tabindex","0");
			$("#signInLabel").attr("role","button");
			$("#signInLabel").attr("onkeypress","clickThisElement(this,event)");
		}
		
		</script>
